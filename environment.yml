# Rebuild with:  conda env create -f environment.yml
# Update with:   conda env update -f environment.yml
name: mscaging
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  - pip:
      - scanpy>=1.12
      - anndata
      - scikit-learn
      - seaborn
      - pooch
      - leidenalg
      - igraph
      - scikit-image
      - pydeseq2
      - lightgbm
      - jupyterlab
      - ipykernel
      - nbdime
      # cross-tissue modules (11-16)
      - decoupler        # pathway, transcription factor and miRNA activity
      - liana            # ligand-receptor communication
      - mofapy2          # multi-omics factor analysis
      - pysindy          # sparse identification of nonlinear dynamics
      - moscot           # optimal transport between ages (pulls jax)
      - torchdiffeq      # neural ODE
      # CPU PyTorch: pip install torch --index-url https://download.pytorch.org/whl/cpu
